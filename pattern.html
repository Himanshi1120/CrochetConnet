<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Explorer</title>
    <link rel="stylesheet" href="pattern.css">
</head>
<body>
    <div class="container">
        <h1>Pattern Explorer</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for patterns...">
            <button id="searchButton"><i class="fa fa-search"></i></button>
        </div>
        <div id="patternGrid" class="pattern-grid">
            <div class="pattern-box">
                <img src="pattern1.avif" alt="Pattern 1">
                <div class="overlay">
                    <a href="pattern1.avif">Explore</a>
                </div>
            </div>
            <div class="pattern-box">
                <img src="pattern2.avif" alt="Pattern 2">
                <div class="overlay">
                    <a href="pattern2.avif">Explore</a>
                </div>
            </div>
            <div class="pattern-box">
                <img src="pattern3.avif" alt = "Pattern 3">
                <div class="overlay">
                    <a href="pattern3.avif">Explore</a>
                </div>
            </div>
            <div class="pattern-box">
                <img src="https://img.freepik.com/free-photo/top-view-crochet-plush-still-life_23-2151044843.jpg?uid=P3283762&ga=GA1.1.139723518.1703946554&semt=ais_hybrid&w=740" alt="Pattern 4">
                <div class="overlay">
                    <a href="https://img.freepik.com/free-photo/top-view-crochet-plush-still-life_23-2151044843.jpg?uid=P3283762&ga=GA1.1.139723518.1703946554&semt=ais_hybrid&w=740">Explore</a>
                </div>
            </div>
            <div class="pattern-box">
                <img src="https://img.freepik.com/free-photo/cute-plush-toy-made-from-crochet_23-2151145692.jpg?uid=P3283762&ga=GA1.1.139723518.1703946554&semt=ais_hybrid&w=740" alt="Pattern 5">
                <div class="overlay">
                    <a href="https://img.freepik.com/free-photo/cute-plush-toy-made-from-crochet_23-2151145692.jpg?uid=P3283762&ga=GA1.1.139723518.1703946554&semt=ais_hybrid&w=740">Explore</a>
                </div>
            </div>
            <div class="pattern-box">
                <img src="https://img.freepik.com/free-photo/still-life-crochet-plushies_23-2151091233.jpg?uid=P3283762&ga=GA1.1.139723518.1703946554&semt=ais_hybrid&w=740" alt="Pattern 6">
                <div class="overlay">
                    <a href="https://img.freepik.com/free-photo/still-life-crochet-plushies_23-2151091233.jpg?uid=P3283762&ga=GA1.1.139723518.1703946554&semt=ais_hybrid&w=740">Explore</a>
                </div>
            </div>
        </div>
        <div class="register-button">
            <a href="register.html" class="button">Register Your Pattern</a>
        </div>
    </div>

    <script src="pattern.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</body>
</html>
