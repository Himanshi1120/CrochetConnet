<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #fdf4f5;
      margin: 0;
      padding: 2rem;
      color: #333;
    }
    .dashboard {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .dashboard h1 {
      color: #ff6f91;
      text-align: center;
      margin-bottom: 2rem;
    }
    .task {
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
    }
    .task h2 {
      margin: 0 0 0.5rem;
      font-size: 1.2rem;
    }
    .task p {
      margin: 0.5rem 0;
      font-size: 1rem;
    }
    .task button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      background: #ff6f91;
      color: #fff;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .task button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>Trainer Dashboard</h1>
    <div class="task">
      <h2>Upcoming Class</h2>
      <p>Prepare for your beginner crochet class scheduled for tomorrow.</p>
      <button>View Details</button>
    </div>
    <div class="task">
      <h2>Student Feedback</h2>
      <p>Review feedback from your recent intermediate class.</p>
      <button>View Feedback</button>
    </div>
    <div class="task">
      <h2>Create a New Course</h2>
      <p>Design and publish a new crochet course for advanced learners.</p>
      <button>Create Course</button>
    </div>
  </div>
</body>
</html>
